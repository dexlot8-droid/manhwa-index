<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter - Dex Manhwa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">Dex Manhwa</a></h1>
            <p class="subtitle">Browse hotlinked manhwa chapters from top sources</p>
        </div>
    </header>

    <main class="container">
        <div id="loading">Loading...</div>
        <div class="chapter-reader" id="reader" style="display:none">
            <h1 id="chapterTitle"></h1>
            <div class="chapter-nav">
                <a href="#" id="prevCh">← Previous</a>
                <button class="btn btn-primary" id="downloadChapterBtn" style="margin:0 10px;padding:6px 14px;font-size:0.9rem">
                    <span>⬇️</span> Download Chapter
                </button>
                <a href="#" id="nextCh">Next →</a>
            </div>
            <div id="chapterImages"></div>
            <div class="chapter-nav" style="margin-top:20px">
                <a href="#" id="prevCh2">← Previous</a>
                <a href="#" id="nextCh2">Next →</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Images hotlinked from original sources. No images hosted here.</p>
        </div>
    </footer>

    <script src="/js/api.js?v=4"></script>
    <script src="/js/reader.js?v=4"></script>
</body>
</html>
